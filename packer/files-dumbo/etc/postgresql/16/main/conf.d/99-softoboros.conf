# PostgreSQL Configuration for Softoboros
# Optimized for connection pooling and pgvector workloads

# Connection Settings
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 3

# Memory Settings
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB

# Write Ahead Log
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# Query Planner
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p] %u@%d '
log_timezone = 'UTC'

# Connection Idle Timeout
# Close idle connections after 10 minutes to prevent connection leaks
idle_in_transaction_session_timeout = 600000

# Client Connection Defaults
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'

# pgvector optimization
# Allow more workers for CREATE INDEX CONCURRENTLY on vector columns
max_parallel_maintenance_workers = 4
