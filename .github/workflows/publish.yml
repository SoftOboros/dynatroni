name: Publish

on:
  push:
    tags: ["pypi-*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Verify release artifacts without AWS
        run: |
          python -I -m pip install dist/*.whl 'patroni[psycopg3]'
          python -I tests/test_installed_discovery.py
          python -I -m pip install --force-reinstall --no-deps dist/*.tar.gz
          python -I tests/test_installed_discovery.py

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          provenance: true
