name: CI

on:
  pull_request:
    branches: [main, v0.1.1]
  push:
    branches: [main, v0.1.1]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.14']
        artifact: [wheel, sdist]
        patroni: ['patroni[psycopg3]']
        include:
          - python: '3.9'
            artifact: wheel
            patroni: 'patroni[psycopg3]==3.3.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist/wheel
        run: python -m build

      - name: Install built wheel
        if: matrix.artifact == 'wheel'
        run: python -I -m pip install dist/*.whl '${{ matrix.patroni }}'

      - name: Install built source distribution
        if: matrix.artifact == 'sdist'
        run: python -I -m pip install dist/*.tar.gz '${{ matrix.patroni }}'

      - name: Verify installed discovery and factory without AWS
        run: python -I tests/test_installed_discovery.py

      - name: Verify uninstall preserves Patroni
        run: |
          python -I -m pip uninstall -y dynatroni
          python -I - <<'PY'
          import importlib.util
          import patroni.dcs
          assert importlib.util.find_spec('patroni.dcs.dynamodb') is None
          assert patroni.dcs.AbstractDCS
          PY
