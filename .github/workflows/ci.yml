name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Install package (editable)
        run: pip install -e .

      - name: Import check
        run: |
          python - <<'PY'
          import dynatroni
          print("dynatroni", dynatroni.__version__)
          PY

      - name: Build sdist/wheel
        run: python -m build
